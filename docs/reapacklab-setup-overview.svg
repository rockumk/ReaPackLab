<rect x="1140" y="695" width="158" height="35" rx="9" fill="#fff1db" stroke="#ebba75"/><text x="1219" y="720" text-anchor="middle" class="body">VST / VST3 / CLAP</text>
<rect x="966" y="738" width="332" height="29" rx="9" fill="#ffebf1" stroke="#eaa5bc"/><text x="1132" y="759" text-anchor="middle" class="small">Classroom tools and more</text>
<rect x="30" y="799" width="820" height="68" rx="13" fill="#e5f8f0" stroke="#54b995" stroke-width="2"/>
<text x="50" y="825" class="bold">Quick start</text>
<text x="50" y="849" class="small">Create &amp; host INI → IT places url.txt → Run ReaBootLab → Restart REAPER when prompted</text>
