<rect x="966" y="649" width="159" height="35" rx="9" fill="#e0efff" stroke="#8bbce4"/><text x="1046" y="674" text-anchor="middle" class="body">📦 Scripts</text>
<rect x="1140" y="649" width="158" height="35" rx="9" fill="#efe8ff" stroke="#bea6ea"/><text x="1219" y="674" text-anchor="middle" class="body">Extensions</text>
