<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="890" viewBox="0 0 1360 890" role="img" aria-labelledby="title desc">
<title id="title">How ReaPackLab Gets Its Packages</title>
<desc id="desc">Six-step ReaLab guide: create and host a ReaPackLab.ini configuration, place the protected url.txt on each Mac, install via ReaBootLab and ReaPackLabSetup, and download packages from teacher-approved repositories.</desc>
<defs>
 <linearGradient id="navy" x2="1" y2="1"><stop stop-color="#102744"/><stop offset="1" stop-color="#153e58"/></linearGradient>
 <linearGradient id="teal" x2="1" y2="0"><stop stop-color="#077f83"/><stop offset="1" stop-color="#06666d"/></linearGradient>
 <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#0c9992"/></marker>
 <style>
 text{font-family:Arial,'Helvetica Neue',sans-serif;fill:#17304a}
 .title{font-size:37px;font-weight:700;fill:white}
 .sub{font-size:20px;fill:#b8efeb}
 .head{font-size:23px;font-weight:700;fill:white}
 .body{font-size:17px}
 .small{font-size:15px}
 .bold{font-size:19px;font-weight:700}
 .mono{font-family:ui-monospace,Menlo,monospace;font-size:14px}
 .panel{fill:white;stroke:#a8cad3;stroke-width:2}
 .chip{fill:#e5f6f4}
 .num{font-size:25px;font-weight:700;fill:white}
 .line{stroke:#0c9992;stroke-width:5;fill:none;marker-end:url(#arrow)}
 </style>
</defs>
<rect width="1360" height="890" fill="#f5f9fb"/>
<rect width="1360" height="112" fill="url(#navy)"/>
<text x="680" y="53" text-anchor="middle" class="title">How ReaPackLab Gets Its Packages</text>
<text x="680" y="86" text-anchor="middle" class="sub">A simple setup guide for your Mac music lab</text>
<!-- top row cards -->
<g>
 <rect class="panel" x="30" y="142" width="412" height="254" rx="16"/>
 <rect x="30" y="142" width="412" height="53" rx="16" fill="url(#teal)"/>
 <circle cx="66" cy="167" r="25" fill="#159e92" stroke="white" stroke-width="3"/><text x="66" y="175" text-anchor="middle" class="num">1</text>
 <text x="104" y="176" class="head">Create configuration</text>
 <rect x="77" y="215" width="313" height="104" rx="12" fill="#e9f3fc" stroke="#345e82" stroke-width="3"/>
 <rect x="77" y="215" width="313" height="26" rx="12" fill="#35628a"/>
 <circle cx="98" cy="228" r="5" fill="#f77b81"/><circle cx="114" cy="228" r="5" fill="#ffd266"/><circle cx="130" cy="228" r="5" fill="#84d39a"/>
 <text x="233" y="269" text-anchor="middle" class="bold">Configuration Editor</text>
 <rect x="104" y="284" width="19" height="19" rx="4" fill="#12a07c"/><path d="M109 292l4 4 7-9" fill="none" stroke="white" stroke-width="3"/>
 <path d="M135 293h208" stroke="#91a9c4" stroke-width="8" stroke-linecap="round"/>
 <text x="236" y="347" class="body" text-anchor="middle">Create ReaPackLab.ini with</text>
 <text x="236" y="370" class="body" text-anchor="middle">repositories and lab settings</text>
</g>
<path class="line" d="M445 268 H473"/>
<g>
 <rect class="panel" x="477" y="142" width="406" height="254" rx="16"/>
 <rect x="477" y="142" width="406" height="53" rx="16" fill="url(#teal)"/>
 <circle cx="512" cy="167" r="25" fill="#159e92" stroke="white" stroke-width="3"/><text x="512" y="175" text-anchor="middle" class="num">2</text>
 <text x="551" y="176" class="head">Host ReaPackLab.ini</text>
 <path d="M554 268c-6-31 16-49 42-44 9-33 57-32 66 0 29-5 51 20 42 44z" fill="#43a2e2"/>
 <path d="M604 245v-7a11 11 0 0 1 22 0v7" fill="none" stroke="white" stroke-width="4"/>
 <rect x="600" y="245" width="30" height="24" rx="4" fill="white"/>
 <text x="615" y="284" text-anchor="middle" class="small" font-weight="700">HTTPS</text>
 <path d="M739 217h72l27 27v77h-99z" fill="#edf4ff" stroke="#27547d" stroke-width="3"/>
 <path d="M811 217v27h27" fill="none" stroke="#27547d" stroke-width="3"/>
 <text x="788" y="269" text-anchor="middle" class="small" font-weight="700">ReaPackLab.ini</text>
 <text x="680" y="350" text-anchor="middle" class="body">Teacher updates repository list</text>
 <text x="680" y="373" text-anchor="middle" class="body">online whenever needed</text>
</g>
<path class="line" d="M886 268 H916"/>
<g>
