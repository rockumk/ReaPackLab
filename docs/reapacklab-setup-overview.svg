<path class="line" d="M968 518 H1042"/>
<rect x="1054" y="489" width="239" height="59" rx="9" fill="#dff6e8" stroke="#4cab7c" stroke-width="2"/>
<text x="1173" y="515" text-anchor="middle" class="bold">ReaPackLab</text>
<text x="1173" y="536" text-anchor="middle" class="small">inside REAPER</text>
