<rect x="304" y="658" width="192" height="66" rx="10" fill="#e2f2ff" stroke="#6ba7cd" stroke-width="2"/>
<text x="400" y="686" text-anchor="middle" class="bold">HTTPS</text>
<text x="400" y="708" text-anchor="middle" class="small">ReaPackLab.ini</text>
<path class="line" d="M502 691 H558"/>
<text x="569" y="680" text-anchor="middle" class="small">✓</text>
<text x="340" y="751" text-anchor="middle" class="small">Valid local url.txt is authoritative; fallback only if missing/invalid</text>
<rect class="panel" x="670" y="588" width="660" height="185" rx="16"/>
<rect x="670" y="588" width="660" height="46" rx="16" fill="url(#teal)"/>
<circle cx="705" cy="611" r="23" fill="#159e92" stroke="white" stroke-width="3"/><text x="705" y="619" text-anchor="middle" class="num">6</text>
<text x="744" y="619" class="head">ReaPackLab installs approved packages</text>
