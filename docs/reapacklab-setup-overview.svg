<rect class="panel" x="30" y="588" width="620" height="185" rx="16"/>
<rect x="30" y="588" width="620" height="46" rx="16" fill="url(#teal)"/>
<circle cx="66" cy="611" r="23" fill="#159e92" stroke="white" stroke-width="3"/><text x="66" y="619" text-anchor="middle" class="num">5</text>
<text x="104" y="619" class="head">ReaPackLab reads the configuration</text>
<rect x="64" y="658" width="149" height="66" rx="10" fill="#f0eaff" stroke="#8863c2" stroke-width="2"/>
<text x="138" y="693" text-anchor="middle" class="bold">url.txt</text>
