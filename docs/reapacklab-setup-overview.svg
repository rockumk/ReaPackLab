 <path d="M1078 211v28h28" fill="none" stroke="#7543ad" stroke-width="3"/>
 <text x="1039" y="265" text-anchor="middle" class="bold">url.txt</text>
 <text x="1039" y="289" text-anchor="middle" class="small">ONE HTTPS URL</text>
 <path class="line" d="M1114 271h45"/>
 <rect x="1169" y="223" width="120" height="86" rx="7" fill="#23618d" stroke="#24445e" stroke-width="4"/>
 <rect x="1176" y="230" width="106" height="69" rx="3" fill="#a7d8ff"/>
 <path d="M1228 311v13m-32 4h65" stroke="#24445e" stroke-width="5" stroke-linecap="round"/>
 <text x="1125" y="351" text-anchor="middle" class="mono" font-size="13">/Library/Application Support/</text>
 <text x="1125" y="373" text-anchor="middle" class="mono" font-size="13">ReaPackLab/url.txt</text>
</g>
<!-- installation row -->
<rect class="panel" x="30" y="420" width="1300" height="146" rx="16"/>
<rect x="30" y="420" width="1300" height="49" rx="16" fill="url(#teal)"/>
