name: Publish ReaPackLab stable-channel ARM64 package
on:
  push:
    paths:
      - '.github/workflows/publish-stable-arm64.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Reuse previously verified build from GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh release download 'v0.14.0-dev.7' --repo "$GITHUB_REPOSITORY" --pattern 'reaper_reapacklab-arm64.dylib' --dir dist
          printf '%s  %s\n' '9d1ba24124315c0720712de9982232b0fa31e24e09738fa162e7143b6b000644' 'dist/reaper_reapacklab-arm64.dylib' | sha256sum --check
          test "$(stat -c '%s' 'dist/reaper_reapacklab-arm64.dylib')" -gt 100000
      - name: Publish version as normal stable-channel package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view 'v0.14.1' --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Version v0.14.1 already exists; refusing to replace it."
            exit 1
          fi
          gh release create 'v0.14.1' 'dist/reaper_reapacklab-arm64.dylib' --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title 'ReaPackLab v0.14.1' --notes 'Stable-channel package of the existing tested-build-artifact from 0.14.0-dev.7 for macOS Apple Silicon. No binary rebuild: embedded build identity remains 0.14.0-dev.7. SHA-256: 9d1ba24124315c0720712de9982232b0fa31e24e09738fa162e7143b6b000644. Package is intended for controlled classroom testing; it has not been verified in all lab computers. Restart REAPER after installing or updating the extension.'
